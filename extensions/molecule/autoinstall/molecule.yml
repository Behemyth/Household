---
dependency:
  enabled: true
  name: galaxy
  options:
    requirements-file: requirements.yml
    role-file: requirements.yml

driver:
  name: docker

platforms:
  - name: manager
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /sbin/init
    privileged: true
    groups:
      - managers

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  scenario:
    name: autoinstall
  config_options:
    defaults:
      stdout_callback: yaml

verifier:
  name: ansible
