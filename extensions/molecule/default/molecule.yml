---
dependency:
  enabled: true
  name: galaxy
  options:
    requirements-file: requirements.yml
    role-file: requirements.yml

driver:
  name: docker
  networks:
    - name: manager_network
      driver: bridge
    - name: worker_network
      driver: overlay
platforms:
  - name: manager
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    network:
      - manager_network
    groups:
      - managers

  - name: worker-1
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    network:
      - worker_network
    groups:
      - workers

  - name: worker-2
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    network:
      - worker_network
    groups:
      - workers

  - name: worker-3
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    network:
      - worker_network
    groups:
      - workers

  - name: worker-4
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    network:
      - worker_network
    groups:
      - workers

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  scenario:
    name: default
  playbooks:
    converge: converge.yml

verifier:
  name: ansible
