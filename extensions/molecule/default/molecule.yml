---
dependency:
  enabled: true
  name: galaxy
  options:
    requirements-file: requirements.yml
    role-file: requirements.yml

driver:
  name: docker

platforms:
  - name: manager
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    # Expose this repository to the container
    volumes:
      -
    groups:
      - managers

  - name: worker-1
    image: debian:latest
    pre_build_image: true
    groups:
      - workers

  - name: worker-2
    image: debian:latest
    pre_build_image: true
    groups:
      - workers

  - name: worker-3
    image: debian:latest
    pre_build_image: true
    groups:
      - workers

  - name: worker-4
    image: debian:latest
    pre_build_image: true
    groups:
      - workers

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  scenario:
    name: default
  playbooks:
    converge: converge.yml

verifier:
  name: ansible
