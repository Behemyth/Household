---
- name: Prepare Managers
  hosts: managers
  gather_facts: true
  become: true
  tasks:
    - name: Add the user expected by autoinstall.yml
      ansible.builtin.user:
        name: synodic
        shell: /bin/bash
        groups: users,admin,wheel

    # Our cloud-init script will have already enabled IPv4 forwarding
    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: 1
        state: present
        reload: true
