#cloud-config
autoinstall:
  version: 1
  network:
    version: 2
    # The manger device interfaces are enp1s0, enp2s0,... enp5s0
    ethernets:
      enp1s0:
        optional: false
        dhcp4: true
        nameservers:
          addresses:
            - 10.4.2.1
            - 8.8.8.8
            - 8.8.4.4
      switchports:
        match:
          name: enp*
        optional: true
    bridges:
      bridge0:
        interfaces: [switchports]
        optional: false
        addresses:
          - 10.42.0.1/24
  ssh:
    install-server: yes
    authorized-keys:
      - { { ds.meta_data.host_ssh_public } }
    allow-pw: no
  user-data:
    hostname: synodic
    manage_etc_hosts: true

    users:
      - name: synodic
        groups: users,admin,wheel
        shell: /bin/bash
        lock_passwd: true
        ssh_authorized_keys:
          - { { ds.meta_data.host_ssh_public } }
        sudo: ALL=(ALL) NOPASSWD:ALL

    ssh_keys:
      ed25519_private: { { ds.meta_data.shh_private } }
      ed25519_public: { { ds.meta_data.shh_public } }

    ssh_pwauth: false
    ssh_deletekeys: false
    no_ssh_fingerprints: true
    ssh:
      emit_keys_to_console: false
    runcmd:
      # Enable IP forwarding that is persistent across reboots
      - echo 'net.ipv4.ip_forward=1' | sudo tee /etc/sysctl.d/99-forward.conf
