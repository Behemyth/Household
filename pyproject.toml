[project]
description = "Home server package"
name = "household"

authors = [
  {name = "Asher Norland", email = "asher.norland@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"

dynamic = ["version"]

requires-python = ">=3.12" # Pinned to Ubuntu 24 version

dependencies = [
  "ansible>=11.1.0",
  "ansible-vault>=2.1",
  "requests>=2.32.3",
  "azure-common>=1.1.28",
  "azure-identity>=1.19.0",
  "azure-keyvault>=4.2.0",
  "msrest>=0.7.1",
  "pyyaml>=6.0.2",
  "pydantic>=2.10.3",
]

[project.urls]
homepage = "https://github.com/Behemyth/Household"
repository = "https://github.com/Behemyth/Household"

[tool.pdm.dev-dependencies]
lint = [
  "ruff>=0.8.1",
  "mypy>=1.13",
]
test = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.14.0",
  "pytest-testinfra[ansible]>=10.1.0",
]

[tool.pytest.ini_options]
log_cli = true
markers = [
  "setup: Tests that should be run prior to any automation, verifying static IP setup",
]
testpaths = [
  "tests",
]

[tool.mypy]
exclude = "__pypackages__"
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = [
  "D206",
  "D300",
  "D415",
  "E111",
  "E114",
  "E117",
]
select = [
  "D", # pydocstyle
  "F", # Pyflakes
  "I", # isort
  "PL", # pylint
  "UP", # pyupgrade
  "E", # pycodestyle
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
  "PT", # flake8-pytest-style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "single"

[tool.coverage.report]
skip_empty = true

[tool.pdm.options]
update = ["--update-all"]

[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
analyze = {shell = "ruff check household tests"}
format = {shell = "ruff format"}
lint = {composite = ["analyze", "format", "type-check"]}
test = {shell = "pytest --cov=household --verbose tests"}
type-check = {shell = "mypy ."}

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
