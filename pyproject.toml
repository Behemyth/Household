[project]
description = "Home server package"
name = "household"

authors = [
  {name = "Asher Norland", email = "asher.norland@gmail.com"},
]
license = "MIT"
readme = "README.md"

dynamic = ["version"]

requires-python = ">=3.10"

dependencies = [
  "ansible>=7.3.0",
]

[project.license-files]
paths = ["LICENSE.md"]

[project.urls]
homepage = "https://github.com/Behemyth/Household"
repository = "https://github.com/Behemyth/Household"

[tool.pdm]
version = {use_scm = true}

[tool.pdm.dev-dependencies]
lint = [
  "black>=22.6.0",
  "pylint>=2.14.5",
  "isort>=5.10.1",
  "mypy>=1.2",
]
test = [
  "pytest>=7.1.2",
  "pytest-testinfra>=7.0.0",
]

[tool.pdm.scripts]
analyze = {shell = "pylint --verbose household tests"}
format = {shell = "black --check --verbose ."}
lint = {composite = ["analyze", "format", "sort-imports", "type-check"]}
sort-imports = {shell = "isort --check-only --diff --verbose ."}
test = {shell = "pytest --ansible-inventory=hosts"}
type-check = {shell = "mypy ."}

[tool.pytest.ini_options]
log_cli = true
testpaths = [
  "tests",
]

[tool.black]
line-length = 120
preview = true

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
exclude = "__pypackages__"
show_error_codes = true
strict = true

[tool.pylint.MAIN]
load-plugins = [
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
  "pylint.extensions.docstyle",
  "pylint.extensions.docparams",
  "pylint.extensions.private_import",
  "pylint.extensions.bad_builtin",
]

[tool.pylint.format]
max-line-length = "120"

[tool.pylint.parameter_documentation]
accept-no-param-doc = false
accept-no-raise-doc = false
accept-no-return-doc = false
accept-no-yields-doc = false
default-docstring-type = "google"

[tool.coverage.report]
skip_empty = true

[build-system]
build-backend = "pdm.pep517.api"
requires = ["pdm-pep517"]
