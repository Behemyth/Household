[project]
description = "Home server package"
name = "household"

authors = [
  {name = "Asher Norland", email = "asher.norland@gmail.com"},
]
license = "MIT"
readme = "README.md"

dynamic = ["version"]

requires-python = ">=3.12"

dependencies = [
  "ansible[azure]>=9.5.1",
  "ansible-vault>=2.1",
  "requests>=2.31.0",
  "azure-common>=1.1.28",
  "azure-identity>=1.16.0",
  "azure-keyvault>=4.2.0",
  "msrest>=0.7.1",
]

[project.license-files]
paths = ["LICENSE.md"]

[project.urls]
homepage = "https://github.com/Behemyth/Household"
repository = "https://github.com/Behemyth/Household"

[tool.pdm]
version = {use_scm = true}

[tool.pdm.dev-dependencies]
lint = [
  "black>=24.4.2",
  "pylint>=3.1.0",
  "isort>=5.13.2",
  "mypy>=1.10",
]
test = [
  "pytest>=8.2.0",
  "pytest-testinfra>=10.1.0",
]

[tool.pdm.scripts]
analyze = {shell = "pylint --verbose household tests"}
format = {shell = "black --check --verbose ."}
lint = {composite = ["analyze", "format", "sort-imports", "type-check"]}
sort-imports = {shell = "isort --check-only --diff --verbose ."}
test = {shell = "pytest"}
type-check = {shell = "mypy ."}

[tool.pytest.ini_options]
log_cli = true
markers = [
  "setup: Tests that should be run prior to any automation, verifying static IP setup",
]
testpaths = [
  "tests",
]

[tool.black]
line-length = 120
preview = true

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
exclude = "__pypackages__"
ignore_missing_imports = true
show_error_codes = true
strict = true

[tool.pylint.MAIN]
load-plugins = [
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
  "pylint.extensions.docstyle",
  "pylint.extensions.docparams",
  "pylint.extensions.private_import",
  "pylint.extensions.bad_builtin",
]

[tool.pylint.format]
max-line-length = "120"

[tool.pylint.parameter_documentation]
accept-no-param-doc = false
accept-no-raise-doc = false
accept-no-return-doc = false
accept-no-yields-doc = false
default-docstring-type = "google"

[tool.coverage.report]
skip_empty = true

[build-system]
build-backend = "pdm.pep517.api"
requires = ["pdm-pep517"]
