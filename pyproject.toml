[project]
authors = [
  {name = "Asher Norland", email = "asher.norland@gmail.com"},
] 
description = "Ansible roles for my homelab" 
dynamic = ["version"] 
license = {text = "MIT"} 
name = "homelab" 
readme = "README.md" 
requires-python = ">=3.12" # Pinned to Ubuntu 24 version

dependencies = [
  "ansible-vault>=4.1.0",
  "pydantic>=2.11.7",
  "pyyaml>=6.0.2",
  "ansible-dev-tools>=25.5.2",
]

[project.urls]
homepage = "https://github.com/Behemyth/homelab"
repository = "https://github.com/Behemyth/homelab"

[dependency-groups]
lint = [
  "ruff>=0.12.0",
  "mypy>=1.16.1",
  "types-docker>=7.1.0.20250523",
]
test = [
  "docker>=7.1.0",
  "dnspython>=2.7.0",
  "molecule>=25.6.0",
  "pytest>=8.4.1",
  "pytest-mock>=3.14.1",
  "molecule-plugins[docker]>=23.7.0",
]

[tool.pytest.ini_options]
log_cli = true
markers = [
  "setup: Tests that should be run prior to any automation, verifying static IP setup",
]
testpaths = [
  "tests",
]

[tool.mypy]
exclude = "__pypackages__"
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = [
  "D206",
  "D300",
  "D415",
  "E111",
  "E114",
  "E117",
]
select = [
  "D", # pydocstyle
  "F", # Pyflakes
  "I", # isort
  "PL", # pylint
  "UP", # pyupgrade
  "E", # pycodestyle
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
  "PT", # flake8-pytest-style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "single"

[tool.coverage.report]
skip_empty = true

[tool.pdm.options]
update = ["--update-all"]

[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
analyze = {cmd = "ruff check tests"}
ansible-lint = {cmd = "ansible-lint"}
destroy.cmd = "molecule destroy"
destroy.working_dir = "extensions"
dev.cmd = "molecule converge"
dev.working_dir = "extensions"
format = {cmd = "ruff format"}
lint = {composite = ["analyze", "format", "type-check", "ansible-lint"]}
test = {cmd = "pytest --verbose tests"}
test-molecule.cmd = "molecule test --all"
test-molecule.working_dir = "extensions"
type-check = {cmd = "mypy ."}

[tool.pdm]
distribution = false
