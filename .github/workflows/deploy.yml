name: Docker Deployment

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    # Deploy the stack to a docker swarm
    - name: Copy
      uses: appleboy/scp-action@v0.1.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        source: "stack-compose.yml, persistent-compose.yml"
        target: "."
        
    - name: Execute
      uses: appleboy/ssh-action@v0.1.1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        script: |
          docker stack deploy --compose-file swarm-compose.yml services
          docker-compose up -d -f persistent-compose.yml
