- name: Remove Obsolete Packages
  become: true
  ansible.builtin.apt:
    state: absent
    pkg:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    force_apt_get: true

- name: Add Docker GPG apt Key
  become: true
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/{{ docker_distribution }}/gpg
    state: present

- name: Add Docker Repository
  become: true
  ansible.builtin.apt_repository:
    repo: deb https://download.docker.com/linux/{{ docker_distribution }} {{ansible_distribution_release }} stable
    state: present

- name: Install Docker Python Module
  ansible.builtin.pip:
    name:
      - docker
    state: present
