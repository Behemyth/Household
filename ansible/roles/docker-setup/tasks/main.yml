- name: Remove Obsolete Packages
  become: true
  ansible.builtin.apt:
    state: absent
    pkg:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    force_apt_get: true

- name: Check For Docker
  ansible.builtin.command: which docker
  failed_when: false
  changed_when: false
  check_mode: false
  register: docker_command_result

- name: Download Docker
  ansible.builtin.get_url:
    url: https://get.docker.com/
    dest: /tmp/get-docker.sh
    mode: "0775"
  when: docker_command_result.rc == 1

- name: Install Docker
  become: true
  ansible.builtin.command: /tmp/get-docker.sh
  environment:
    CHANNEL: stable
  when: docker_command_result.rc == 1

- name: Start Docker
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install Docker Python Module
  ansible.builtin.pip:
    name:
      - docker
      - docker-compose
    state: present

- name: Add Docker User
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
