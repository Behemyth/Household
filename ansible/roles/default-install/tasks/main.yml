- name: Get Required Packages
  become: true
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - curl
      - python3-pip
      - ca-certificates
      - software-properties-common
      - gnupg
      - python3-venv
      - nfs-common
    update_cache: true
    state: present

- name: Install Python Packages
  ansible.builtin.pip:
    name:
      - pipx
    state: present
