- name: Verify Stack Directory
  become: true
  ansible.builtin.file:
    path: "/home/{{ansible_user}}/docker"
    state: directory

- name: Verify Config Directory
  become: true
  ansible.builtin.file:
    path: "/etc/traefik"
    state: directory

- name: Verify Dynamic Config Directory
  become: true
  ansible.builtin.file:
    path: "/etc/traefik/dynamic"
    state: directory

- name: Verify Secret Directory
  become: true
  ansible.builtin.file:
    path: "/etc/traefik/secrets"
    state: directory

- name: Verify Certificate Directory
  become: true
  ansible.builtin.file:
    path: "/etc/traefik/certs"
    state: directory

- name: Create Stack File
  become: true
  ansible.builtin.template:
    src: traefik-stack.j2
    dest: /home/{{ansible_user}}/docker/traefik-stack.yml
    mode: "0775"

- name: Create Traefik Config File
  become: true
  ansible.builtin.template:
    src: traefik.j2
    dest: /etc/traefik/traefik.yml
    mode: "0775"

- name: Create Dynamic Traefik Config File
  become: true
  ansible.builtin.template:
    src: traefik-dynamic.j2
    dest: /etc/traefik/dynamic/traefik.yml
    mode: "0775"

- name: Create Auth Config File
  become: true
  ansible.builtin.template:
    src: auth.j2
    dest: /etc/traefik/secrets/auth.secret
    mode: "0775"

- name: Create DNS Secrete File
  become: true
  ansible.builtin.template:
    src: dns.j2
    dest: /etc/traefik/secrets/google_domains_access_token.secret
    mode: "0775"

- name: Deploy the Stack
  community.docker.docker_stack:
    state: present
    name: traefik
    prune: true
    compose:
      - /home/{{ansible_user}}/docker/traefik-stack.yml
