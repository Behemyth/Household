- name: Configure Manager Network Setup
  hosts: mini-behemyth
  become: true
  tasks:
    - name: Configure Manager Network
      ansible.builtin.import_role:
        name: manager-network


- name: Configure Node Network Setup
  hosts: workers
  become: true
  tasks:
    - name: Configure Node Networks
      ansible.builtin.import_role:
        name: node-network

- name: Reboot Nodes
  hosts: workers
  become: true
  tasks:
    - name: Reboot Nodes
      become: true
      ansible.builtin.reboot:

- name: Reboot Manager
  hosts: mini-behemyth
  become: true
  tasks:
    - name: Reboot Manager
      become: true
      ansible.builtin.reboot:
