- name: Cluster Installation
  hosts: all
  tasks:
    - name: Configure Tools
      ansible.builtin.import_role:
        name: default-install

    - name: Setup Docker
      ansible.builtin.import_role:
        name: docker

- name: Manager Installation
  hosts: mini-behemyth
  vars_files:
    - vars/azure.yml
  tasks:
    - name: Register Swarm
      community.docker.docker_swarm:
        state: present
      register: swarm_info

    - name: Install Python Packages
      ansible.builtin.pip:
        name:
          - jsondiff
          - pyyaml
        state: present

    - name: Setup Traefik
      ansible.builtin.import_role:
        name: traefik

    - name: Setup NFS Server
      ansible.builtin.import_role:
        name: nfs-server

    - name: Setup NFS Client
      ansible.builtin.import_role:
        name: nfs-client


- name: Node Installation
  hosts: workers
  tasks:

    - name: Check For Fan Software
      ansible.builtin.command: command -v argonone-config
      failed_when: false
      changed_when: false
      check_mode: false
      register: fan_command_result

    - name: Download Fan Software
      ansible.builtin.get_url:
        url: https://download.argon40.com/argon1.sh
        dest: /tmp/argon1.sh
        mode: "0775"
      when: fan_command_result.rc == 1

    - name: Install Fan Software
      ansible.builtin.command: /tmp/argon1.sh
      when: fan_command_result.rc == 1

    - name: Join swarm as worker node
      community.docker.docker_swarm:
        state: join 
        advertise_addr: "{{ inventory_hostname }}"
        join_token: "{{ hostvars['mini-behemyth']['swarm_info']['swarm_facts']['JoinTokens']['Worker'] }}"
        remote_addrs: [ '10.42.0.1:2377' ]

    - name: Setup NFS Client
      ansible.builtin.import_role:
        name: nfs-client

- name: Cluster Stacks
  hosts: mini-behemyth
  tasks:
    - name: Setup Portainer
      ansible.builtin.import_role:
        name: portainer

    - name: Setup Artifactory
      ansible.builtin.import_role:
        name: artifactory