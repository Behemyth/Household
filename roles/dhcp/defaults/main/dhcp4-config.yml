kea_dhcp4_config:
  Dhcp4:
    interfaces-config:
      interfaces:
        - "enp1s0"

    lease-database:
      type: memfile
      persist: true
      name: /var/lib/kea/dhcp4.leases

    dhcp-ddns:
      enable-updates: true

    ddns-send-updates: true
    ddns-qualifying-suffix: ""

    valid-lifetime: 4000
    renew-timer: 1000
    rebind-timer: 2000

    subnet4:
      - subnet: 10.42.0.0/24
        pools:
          - pool: 10.42.0.10 - 10.42.0.100
        option-data:
          - name: routers
            data: 10.42.0.1
          - name: domain-name-servers
            data: 10.42.0.1 8.8.8.8, 8.8.4.4
