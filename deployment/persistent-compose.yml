version: '3'

services:
    reverse:
        image: jwilder/nginx-proxy:latest
        ports:
        - 80:80
        - 443:443
        volumes:
        - /var/run/docker.sock:/tmp/docker.sock:ro

    docker:
        environment:
            - VIRTUAL_HOST=docker.behemythic.com
        image: registry:latest
        volumes:
            - docker-data:/var/lib/registry
        ports:
            - 5000:5000

    artifactory:
        environment:
            - VIRTUAL_HOST=artifactory.behemythic.com
        image: docker.bintray.io/jfrog/artifactory-cpp-ce:latest
        volumes:
            - artifactory_data:/var/opt/jfrog/artifactory
        ports:
            - 8081:8081

volumes:
    docker-data:
    artifactory_data:
