    "MarkupSafe>=2.0",
]

[[package]]
name = "lazy-object-proxy"
version = "1.7.1"
requires_python = ">=3.6"
summary = "A fast and thorough lazy object proxy."

[[package]]
name = "markupsafe"
version = "2.1.1"
requires_python = ">=3.7"
summary = "Safely add untrusted strings to HTML/XML markup."

[[package]]
name = "mccabe"
