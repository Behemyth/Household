[[package]]
name = "ansible"
version = "6.5.0"
requires_python = ">=3.8"
summary = "Radically simple IT automation"
dependencies = [
    "ansible-core~=2.13.5",
]

[[package]]
name = "ansible-core"
version = "2.13.5"
requires_python = ">=3.8"
summary = "Radically simple IT automation"
dependencies = [
    "PyYAML>=5.1",
    "cryptography",
    "jinja2>=3.0.0",
    "packaging",
    "resolvelib<0.9.0,>=0.5.3",
]

[[package]]
name = "astroid"
version = "2.12.12"
requires_python = ">=3.7.2"
summary = "An abstract syntax tree for Python with inference support."
dependencies = [
    "lazy-object-proxy>=1.4.0",
    "wrapt<2,>=1.11; python_version < \"3.11\"",
    "wrapt<2,>=1.14; python_version >= \"3.11\"",
]

[[package]]
name = "black"
version = "22.10.0"
requires_python = ">=3.7"
summary = "The uncompromising code formatter."
dependencies = [
    "click>=8.0.0",
    "mypy-extensions>=0.4.3",
    "pathspec>=0.9.0",
    "platformdirs>=2",
    "tomli>=1.1.0; python_full_version < \"3.11.0a7\"",
]

[[package]]
name = "cffi"
version = "1.15.1"
