version: '3'

services:
    reverse:
        image: lroguet/rpi-nginx-proxy:latest
        ports:
        - 80:80
        - 443:443
        volumes:
        - /var/run/docker.sock:/tmp/docker.sock:ro

    docker:
        environment:
            - VIRTUAL_HOST=docker.behemythic.com
        image: registry:latest
        volumes:
            - /mnt/gluster/registry/data:/var/lib/registry
            - /mnt/gluster/registry/certs:/certs
            - /mnt/gluster/registry/auth:/auth
        ports:
            - 5000:5000
