version: '3.8'

services:
    traefik:
        image: traefik:latest
        command:
            - --entrypoints.web.address=:80
            - --entrypoints.web-secured.address=:443
            - --entrypoints.minecraft.address=:19132/udp
            - --providers.docker.exposedbydefault=false
            - --providers.docker=true
            - --providers.docker.swarmMode=true
        ports:
            - 80:80
            - 443:443
            - 19132:19132/udp # UDP ports don't have routing rules
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
        deploy:
            placement:
                constraints:
                    - "node.labels.arch==amd64"
            labels:
                - "traefik.enable=true"

    conan:
        image: conanio/conan_server:latest
        labels:
            - "traefik.http.routers.conan.rule=Host(`conan.behemythic.com`)"
            - "traefik.udp.services.conan.loadBalancer.server.port=9300"
        deploy:
            placement:
                constraints:
                    - "node.labels.arch==amd64"

    minecraft:
        environment:
            - SERVER_NAME=Behemythical
            - EULA=TRUE
            - GAMEMODE=survival
            - DIFFICULTY=hard
            - VIEW_DISTANCE=12
        image: itzg/minecraft-bedrock-server:latest
        depends_on:
            - "traefik"
        volumes:
            - minecraft-data:/data
        labels:
            - "traefik.udp.routers.minecraft.entrypoints=minecraft"
            - "traefik.udp.routers.minecraft.service=minecraft"
            - "traefik.udp.services.minecraft.loadBalancer.server.port=19132"

        stdin_open: true
        tty: true
        deploy:
            placement:
                constraints:
                    - "node.labels.arch==amd64"

volumes:
    minecraft-data: