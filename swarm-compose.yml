version: '3.8'

services:
    traefik:
        image: traefik
        command:
            - --entrypoints.web.address=:80
            - --entrypoints.web-secured.address=:443
            - --providers.docker=true
            - --providers.docker.swarmMode=true
            - --api.insecure=true
        ports:
            - 80:80
            - 8080:8080 # traefik dashboard
            - 443:443
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
        deploy:
            labels:
                - "traefik.enable=true"
                - "traefik.http.routers.api.rule=Host(`traefik.behemythic.com`)"
                - "traefik.http.routers.api.service=api@internal"

    conan:
        image: conanio/conan_server:latest
        ports:
            - 9300:9300
        labels:
        - "traefik.http.routers.conan.rule=Host(`conan.behemythic.com`)"

    minecraft:
        environment:
            - SERVER_NAME=Behemythical
            - EULA=TRUE
            - GAMEMODE=survival
            - DIFFICULTY=hard
            - VIEW_DISTANCE=12
        image: itzg/minecraft-bedrock-server:latest
        ports:
            - 19132:19132/udp
        volumes:
            - minecraft-data:/data
        labels:
            - "traefik.http.routers.minecraft.rule=Host(`minecraft.behemythic.com`)"
        stdin_open: true
        tty: true

volumes:
    minecraft-data: