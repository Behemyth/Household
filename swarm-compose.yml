version: '3.8'

services:
    traefik:
        image: traefik
        command:
            - --entrypoints.web.address=:80
            - --entrypoints.web-secured.address=:443
            - --providers.docker=true
            - --providers.docker.swarmMode=true
            - --api.insecure=true
            - --providers.docker.defaultrule=Host(`{{ index .Labels "com.docker.compose.service" }}.behemythic.com`)
        ports:
            - 80:80
            - 443:443
            - 19132:19132/udp # UDP ports don't have routing rules
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
        deploy:
            labels:
                - "traefik.enable=true"

    conan:
        image: conanio/conan_server:latest
        ports:
            - 9300:9300

    minecraft:
        environment:
            - SERVER_NAME=Behemythical
            - EULA=TRUE
            - GAMEMODE=survival
            - DIFFICULTY=hard
            - VIEW_DISTANCE=12
        image: itzg/minecraft-bedrock-server:latest
        ports:
            - 19132:19132/udp
        volumes:
            - minecraft-data:/data
        stdin_open: true
        tty: true

volumes:
    minecraft-data: