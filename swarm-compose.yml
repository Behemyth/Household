version: '3.8'

services:
    reverse:
        image: jwilder/nginx-proxy:latest
        ports:
        - 80:80
        - 443:443
        volumes:
        - /var/run/docker.sock:/tmp/docker.sock:ro

    conan:
        environment:
            - VIRTUAL_HOST=conan.behemythic.com
        image: conanio/conan_server:latest
        ports:
            - 9300:9300

    minecraft:
        environment:
            - VIRTUAL_HOST=minecraft.behemythic.com
            - EULA=TRUE
            - GAMEMODE=survival
            - DIFFICULTY=hard
            - WHITE_LIST 
        image: itzg/minecraft-bedrock-server:latest
        volumes:
            - minecraft-data:/data
        ports:
            - 19132:19132/udp
        stdin_open: true
        tty: true

volumes:
    minecraft-data: